<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register</title>
</head>
<body>
  <h1>Create Account</h1>

  <div>
    <label for="email">Email:</label>
    <input id="email" type="email" />
  </div>

  <div>
    <label for="password">Password:</label>
    <input id="password" type="password" />
  </div>

  <div>
    <label for="confirm-password">Confirm Password:</label>
    <input id="confirm-password" type="password" />
  </div>

  <!-- Button text MUST stay exactly "Register" for Playwright -->
  <button id="register-btn" type="button">Register</button>
  <p id="message"></p>

  <script>
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirm-password");
    const messageEl = document.getElementById("message");
    const btn = document.getElementById("register-btn");

    if (btn && messageEl && emailInput && passwordInput && confirmInput) {
      btn.addEventListener("click", async () => {
        console.log("Register button clicked");

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirm = confirmInput.value;

        if (!email || !password || !confirm) {
          messageEl.textContent = "All fields are required.";
          return;
        }

        if (password.length < 6) {
          messageEl.textContent = "Password must be at least 6 characters.";
          return;
        }

        if (password !== confirm) {
          messageEl.textContent = "Passwords do not match.";
          return;
        }

        try {
          const resp = await fetch("/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: email.split("@")[0],
              email,
              password,
            }),
          });

          if (resp.ok) {
            const data = await resp.json();
            if (data.access_token) {
              localStorage.setItem("jwt", data.access_token);
            }
            messageEl.textContent = "Registration successful!";
          } else if (resp.status === 400) {
            const err = await resp.json().catch(() => ({}));
            messageEl.textContent = err.detail || "Registration failed.";
          } else {
            messageEl.textContent = "Registration failed.";
          }
        } catch (err) {
          console.error(err);
          messageEl.textContent = "Network error during registration.";
        }
      });
    } else {
      console.error("Register DOM elements not found");
    }
  </script>
</body>
</html>
